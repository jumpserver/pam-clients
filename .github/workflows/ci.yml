name: SDK contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            agent/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python -m pip install ./python
      - run: npm ci --prefix node
      - run: python docs/build.py --check
      - run: python tests/run.py
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go/go.sum
            agent/go.sum
      - run: python -m pip install build setuptools wheel twine
      - run: python -m unittest discover -s tests -p test_distribution.py
      - run: python distribution.py --output dist
      - run: python -m twine check dist/*/*.whl dist/*/jms_pam-*.tar.gz
      - run: cd "dist/$(python -c 'from distribution import client_version; print(client_version())')" && sha256sum --check SHA256SUMS
      - run: python -m pip install dist/*/*.whl
      - run: cd /tmp && python -c 'from jms_pam import Client'
